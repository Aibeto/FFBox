<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- 透明渐变定义：起始不透明，末端完全透明 -->
  <defs>
    <linearGradient id="fadeGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="currentColor" stop-opacity="1"/>
      <stop offset="100%" stop-color="currentColor" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- 环形路径：仅绘制1/4圆弧，留出空白区间 -->
  <circle cx="32" cy="32" r="25.5" fill="none" stroke="currentColor" stroke-width="6"
          stroke-dasharray="40 120" stroke-dashoffset="0" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate"
                      from="180 32 32" to="540 32 32" dur="0.15s" repeatCount="indefinite"/>
  </circle>
  <circle cx="32" cy="32" r="25.5" fill="none" stroke="url(#fadeGradient)" stroke-width="6"
  stroke-dasharray="80 80" stroke-dashoffset="0" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate"
                from="0 32 32" to="360 32 32" dur="0.15s" repeatCount="indefinite"/>
  </circle>

</svg>