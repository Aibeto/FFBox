<?xml version="1.0" encoding="UTF-8"?>
<svg id="_图层_1" data-name="图层 1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <defs>
    <!-- 用于在字母周边旋转的光晕 -->
    <filter id="haloSmall" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="haloMedium" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="haloBig" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <!-- 用于圆环的光晕 -->
    <filter id="ringHalo" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur">
        <animate
          attributeName="stdDeviation"
          values="0;2;0" dur="2.8s" repeatCount="indefinite"/>
      </feGaussianBlur>
    </filter>
    <!-- 用于描边的线性渐变（可改颜色） -->
    <linearGradient id="ringStroke" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#39a3ff"/>
      <stop offset="50%" stop-color="#7b65ff"/>
      <stop offset="100%" stop-color="#b257ff"/>
    </linearGradient>
  </defs>
  <!-- 字母周边旋转的光晕 -->
  <g style="mix-blend-mode: hard-light">
    <g transform="translate(24,24)">
      <!-- <circle cx="0" cy="0" r="4" fill="#55eeff" opacity="0.3" filter="url(#haloSmall)"/> -->
      <circle cx="0" cy="0" r="6" fill="#55eeff" opacity="0.3" filter="url(#haloMedium)"/>
      <!-- <circle cx="0" cy="0" r="12" fill="#55eeff" opacity="0.12" filter="url(#haloBig)"/> -->
    </g>
    <animateTransform
      attributeName="transform" type="rotate"
      from="0 14 24" to="360 22 24" dur="8s" repeatCount="indefinite"
    />
  </g>
  <g style="mix-blend-mode: hard-light">
    <g transform="translate(24,24)">
      <!-- <circle cx="0" cy="0" r="4" fill="#ff3322" opacity="0.3" filter="url(#haloSmall)"/> -->
      <circle cx="0" cy="0" r="6" fill="#ff3322" opacity="0.3" filter="url(#haloMedium)"/>
      <!-- <circle cx="0" cy="0" r="12" fill="#ff3322" opacity="0.12" filter="url(#haloBig)"/> -->
    </g>
    <animateTransform
      attributeName="transform" type="rotate" begin="-2s"
      from="360 16 20" to="0 24 20" dur="6s" repeatCount="indefinite"
    />
  </g>
  <g style="mix-blend-mode: hard-light">
    <g transform="translate(24,24)">
      <!-- <circle cx="0" cy="0" r="4" fill="#99ee77" opacity="0.3" filter="url(#haloSmall)"/> -->
      <circle cx="0" cy="0" r="6" fill="#99ee77" opacity="0.3" filter="url(#haloMedium)"/>
      <!-- <circle cx="0" cy="0" r="12" fill="#99ee77" opacity="0.12" filter="url(#haloBig)"/> -->
    </g>
    <animateTransform
      attributeName="transform" type="rotate" begin="-3s"
      from="360 30 16" to="0 22 20" dur="7s" repeatCount="indefinite"
    />
  </g>
  <g style="mix-blend-mode: hard-light">
    <g transform="translate(24,24)">
      <!-- <circle cx="0" cy="0" r="4" fill="#9944ff" opacity="0.3" filter="url(#haloSmall)"/> -->
      <circle cx="0" cy="0" r="6" fill="#9944ff" opacity="0.3" filter="url(#haloMedium)"/>
      <!-- <circle cx="0" cy="0" r="12" fill="#9944ff" opacity="0.12" filter="url(#haloBig)"/> -->
    </g>
    <animateTransform
      attributeName="transform" type="rotate" begin="-4s"
      from="0 28 30" to="360 32 26" dur="9s" repeatCount="indefinite"
    />
  </g>
  <g style="mix-blend-mode: hard-light">
    <g transform="translate(24,24)">
      <!-- <circle cx="0" cy="0" r="4" fill="#4433ff" opacity="0.3" filter="url(#haloSmall)"/> -->
      <circle cx="0" cy="0" r="6" fill="#4433ff" opacity="0.3" filter="url(#haloMedium)"/>
      <!-- <circle cx="0" cy="0" r="12" fill="#4433ff" opacity="0.12" filter="url(#haloBig)"/> -->
    </g>
    <animateTransform
      attributeName="transform" type="rotate" begin="-4s"
      from="0 18 32" to="360 26 26" dur="6s" repeatCount="indefinite"
    />
  </g>
  <!-- 字母 -->
  <path d="M22.72,27.82h-5.18l-1.64,3.2h-3.56l7.74-14.32h3.7l2.86,14.32h-3.32l-.6-3.2ZM19,24.98h3.2l-.54-3-.16-1.76h-.2l-.76,1.76-1.54,3Z" fill="currentColor" />
  <path d="M31.36,16.7h3.12l-2.54,14.32h-3.12l2.54-14.32Z" fill="currentColor" />
  <!-- 圆环 -->
  <!-- 光晕：用更粗的同心圆作为“发光源”，套上滤镜；低不透明度避免喧宾夺主 -->
  <g filter="url(#ringHalo)" opacity="1">
    <circle cx="24" cy="24" r="18" fill="none" stroke="#7b65ff" stroke-width="1">
      <animate
        attributeName="opacity"
        values="0;1;0" dur="2.8s" repeatCount="indefinite" />
    </circle>
  </g>
  <!-- 圆环本体：细一些的描边，使用渐变颜色 -->
  <circle cx="24" cy="24" r="18" fill="none" stroke="url(#ringStroke)" stroke-width="1" opacity="1" />
</svg>